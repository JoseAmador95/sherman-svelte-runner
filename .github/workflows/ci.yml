name: ci

# Este repo no tenía CI en PRs. Se añade porque `configurar-avisos.sh` es el
# script del que depende que los avisos del fleet lleguen: si se rompe, no falla
# nada visible — simplemente dejan de llegar avisos, que es indistinguible de un
# fleet sano. Exactamente el fallo silencioso que la vigilancia existe para
# cerrar, así que no puede vivir sin una prueba.
#
# Minutos gratis: el repo es público.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

  # Los scripts del vigía no tenían NINGUNA prueba, y son de la misma familia de fallo silencioso
  # que `configurar-avisos.sh`: si `decidirAviso` deja de hablar, el cron sale verde y no llega
  # ningún mensaje — indistinguible de un fleet sano. Ahora que el fleet mezcla contenedores Linux,
  # VMs de macOS que rotan entre jobs y el runner de escritorio, el reparto por plataforma es
  # justo la parte con lógica que puede romperse sin que nadie lo note.
  vigilancia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sin dependencias ni `package.json`: `node --test` viene en la stdlib y los scripts solo
      # usan `fetch`. Las pruebas tocan únicamente las funciones puras, así que no hay red.
      - name: Pruebas de las funciones puras del vigía
        run: node --test scripts/*.test.mjs

  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara un entorno de prueba (hooks y curl simulados)
        run: |
          set -eu
          d="$RUNNER_TEMP/av"; mkdir -p "$d/hooks" "$d/bin" "$d/despliegue"
          # Hooks mínimos: aquí se prueba el script, no los hooks (que viven en
          # gh_runner y tienen su propio CI).
          printf '#!/bin/sh\nexit 0\n' > "$d/hooks/10-healthchecks.sh.ejemplo"
          # curl simulado: apunta las URLs que le pidan y falla solo si la URL
          # lleva la marca FALLA. $AV lo exporta GITHUB_ENV, así que el stub lo ve.
          cat > "$d/bin/curl" <<'STUB'
          #!/bin/sh
          for a in "$@"; do case "$a" in https://*) echo "$a" >> "$AV/urls" ;; esac; done
          for a in "$@"; do case "$a" in *FALLA*) exit 22 ;; esac; done
          exit 0
          STUB
          chmod +x "$d/bin/curl"

          # Un compose como el que emite `deploy.sh --prefix sherman … --vigilar`.
          # El directorio se llama "despliegue" A PROPÓSITO: si el nombre del check
          # volviera a salir del nombre de la carpeta, aquí saldría "despliegue" y
          # la prueba lo caza.
          cat > "$d/despliegue/compose.yaml" <<'YAML'
          services:
            vigia:
              environment:
                VIGIA_CLUSTER: "sherman"
                VIGIA_HOST: "mmJA"
          YAML
          echo "AV=$d" >> "$GITHUB_ENV"

      - name: Rechaza configuraciones que no pueden funcionar
        run: |
          set -eu
          export PATH="$AV/bin:$PATH"
          S="sh scripts/configurar-avisos.sh --hooks $AV/hooks --conf $AV/avisos.conf --no-preguntar"
          rechaza() {  # $1 = descripción, resto = argumentos
            _desc="$1"; shift
            _rc=0; _out="$($S "$@" 2>&1)" || _rc=$?
            [ "$_rc" -ne 0 ] || { echo "FALLO: aceptó una configuración inválida ($_desc)"; exit 1; }
            # No basta con "salió distinto de cero": un script que no existe o que
            # revienta también lo hace, y entonces esta prueba daría verde sin
            # comprobar nada. Tiene que ser un rechazo EXPLÍCITO.
            printf '%s\n' "$_out" | grep -q '^ERROR:' \
              || { echo "FALLO: no rechazó ($_desc), falló por otra cosa: $_out"; exit 1; }
            echo "ok: rechaza $_desc"
          }
          # Pegar el token a medias es la causa nº 1 de "no me llegan los avisos".
          rechaza 'una URL que no es https' --hc-url 'http://hc-ping.com/uuid'
          rechaza 'ningún canal'

          # Sin saber a qué cluster pertenece esta máquina, el nombre del check
          # sería una adivinanza — y adivinarlo mal es lo que creaba un check
          # duplicado por despliegue. Mejor parar y decirlo.
          rechaza 'una ping key sin compose.yaml' --compose "$AV/no-existe.yaml" --hc-ping-key 'PKTEST'
          printf 'services:\n  vigia:\n    environment:\n      VIGIA_CLUSTER: "sherman"\n' > "$AV/viejo.yaml"
          rechaza 'un compose sin VIGIA_HOST' --compose "$AV/viejo.yaml" --hc-ping-key 'PKTEST'

      - name: Configura, activa los hooks y prueba los canales
        run: |
          set -eu
          export PATH="$AV/bin:$PATH"
          rm -f "$AV/avisos.conf" "$AV/hooks/10-healthchecks.sh"
          sh scripts/configurar-avisos.sh --hooks "$AV/hooks" --conf "$AV/avisos.conf" --no-preguntar \
             --hc-url 'https://hc-ping.com/uuid-de-prueba'

          # El fichero lleva credenciales: solo su dueño puede leerlo.
          perm="$(stat -c '%a' "$AV/avisos.conf")"
          [ "$perm" = "600" ] || { echo "FALLO: avisos.conf con permisos $perm, se esperaba 600"; exit 1; }
          grep -q "^HC_URL='https://hc-ping.com/uuid-de-prueba'$" "$AV/avisos.conf" || { echo "FALLO: HC_URL"; exit 1; }
          [ -x "$AV/hooks/10-healthchecks.sh" ] || { echo "FALLO: no activó el hook de healthchecks"; exit 1; }
          echo "ok: escribe la configuración y activa los hooks"

      - name: Un canal que no responde sale en ROJO y no pisa lo que funcionaba
        run: |
          set -eu
          export PATH="$AV/bin:$PATH"
          # Si esto saliera en verde, creerías tener avisos configurados y no los
          # tendrías: el fallo aparecería la noche que algo se rompe.
          if sh scripts/configurar-avisos.sh --hooks "$AV/hooks" --conf "$AV/avisos.conf" \
               --no-preguntar --hc-url 'https://hc-ping.com/FALLA' >/dev/null 2>&1; then
            echo "FALLO: un canal roto pasó como bueno"; exit 1
          fi
          echo "ok: un canal roto falla en rojo"

          # Y no debe haberlo guardado. Si lo guardara, como el script reusa lo
          # guardado al re-ejecutarse, un typo en la URL quedaría PEGADO y
          # sobreviviría a los siguientes intentos.
          grep -q 'FALLA' "$AV/avisos.conf" && { echo "FALLO: guardó una configuración que acababa de declarar rota"; exit 1; }
          grep -q "^HC_URL='https://hc-ping.com/uuid-de-prueba'$" "$AV/avisos.conf" \
            || { echo "FALLO: pisó la configuración que sí funcionaba"; exit 1; }
          echo "ok: un intento fallido deja intacto lo que ya funcionaba"

      # El comando del README lo encadena al despliegue, así que corre en cada
      # re-deploy. Si no reusara lo guardado, te pediría el token cada vez.
      - name: Re-ejecutarlo no vuelve a pedir nada
        run: |
          set -eu
          export PATH="$AV/bin:$PATH"
          # Sin banderas, sin entorno y sin poder preguntar: solo puede salir
          # bien si toma los valores del fichero que escribió la vez anterior.
          salida="$(sh scripts/configurar-avisos.sh --hooks "$AV/hooks" --conf "$AV/avisos.conf" --no-preguntar 2>&1)"
          printf '%s\n' "$salida" | grep -q 'Reusando' || {
            echo "FALLO: no reusó la configuración previa"; printf '%s\n' "$salida"; exit 1; }
          # Lo guardado en el paso anterior fue una HC_URL; tiene que seguir ahí.
          grep -q "^HC_URL='https://hc-ping.com/uuid-de-prueba'$" "$AV/avisos.conf" \
            || { echo "FALLO: perdió la configuración guardada"; exit 1; }
          echo "ok: re-ejecutable sin volver a preguntar"

      - name: No pisa un hook que ya hubieras ajustado
        run: |
          set -eu
          export PATH="$AV/bin:$PATH"
          echo '# ajuste propio' >> "$AV/hooks/10-healthchecks.sh"
          sh scripts/configurar-avisos.sh --hooks "$AV/hooks" --conf "$AV/avisos.conf" \
             --compose "$AV/despliegue/compose.yaml" --no-preguntar --hc-ping-key 'PKTEST' >/dev/null 2>&1
          grep -q '# ajuste propio' "$AV/hooks/10-healthchecks.sh" \
            || { echo "FALLO: pisó un hook ya ajustado"; exit 1; }
          echo "ok: idempotente, respeta lo que ya hubieras tocado"

      # El bit de ejecución NO es una personalización: `vigilar.sh` solo corre lo
      # que pasa `[ -x ]`, así que un hook sin él es idéntico a no tenerlo, y en
      # silencio. Antes el `chmod` solo ocurría al CREAR el fichero, de modo que un
      # hook ya presente sin permisos quedaba invisible para este script para
      # siempre: decía "ya estaba activo" y se iba.
      - name: A un hook ya presente SIN permiso de ejecución se lo devuelve
        run: |
          set -eu
          export PATH="$AV/bin:$PATH"
          chmod -x "$AV/hooks/10-healthchecks.sh"
          sh scripts/configurar-avisos.sh --hooks "$AV/hooks" --conf "$AV/avisos.conf" \
             --compose "$AV/despliegue/compose.yaml" --no-preguntar --hc-ping-key 'PKTEST' >/dev/null 2>&1
          [ -x "$AV/hooks/10-healthchecks.sh" ] \
            || { echo "FALLO: el hook sigue sin permiso de ejecución; el vigía lo ignoraría"; exit 1; }
          # Y sin tocar el contenido: lo que se recupera es el permiso, no el fichero.
          grep -q '# ajuste propio' "$AV/hooks/10-healthchecks.sh" \
            || { echo "FALLO: al reponer el permiso pisó el contenido"; exit 1; }
          echo "ok: repone el permiso de ejecución sin tocar lo que hubieras ajustado"

      - name: La prueba pingea EL MISMO check que el vigía, no uno paralelo
        run: |
          set -eu
          export PATH="$AV/bin:$PATH"
          # La regresión que esto cierra: el README encadena deploy.sh con este
          # script, así que las dos identidades se calculaban en el MISMO deploy.
          # Como cada una salía de un sitio distinto —aquí el nombre de la carpeta,
          # allí cluster+máquina—, un solo despliegue creaba DOS checks: el del
          # vigía, bien configurado, y este otro huérfano que nadie pingea nunca
          # más y que al cabo de un día se pone en rojo solo.
          rm -f "$AV/urls" "$AV/avisos.conf"
          sh scripts/configurar-avisos.sh --hooks "$AV/hooks" --conf "$AV/avisos.conf" \
             --compose "$AV/despliegue/compose.yaml" --no-preguntar --hc-ping-key 'PKTEST' >/dev/null 2>&1

          url="$(grep 'hc-ping.com' "$AV/urls" | head -n1)"
          # El slug se fija como literal porque el hook vive en el OTRO repo
          # (gh_runner: hooks/10-healthchecks.sh.ejemplo), donde su CI comprueba
          # la misma forma <cluster>-<máquina> en minúsculas. Son los dos extremos
          # del mismo contrato: si alguien mueve uno, este test lo para.
          esperado='https://hc-ping.com/PKTEST/sherman-mmja?create=1'
          [ "$url" = "$esperado" ] || {
            echo "FALLO: pingeó   '$url'"; echo "       se esperaba '$esperado'"; exit 1; }
          echo "ok: un despliegue crea UN check, y es el del vigía"

      - name: El repo no contiene credenciales
        run: |
          set -eu
          # Es público: una URL de ping o un token de bot aquí serían una fuga.
          if grep -rInE 'hc-ping\.com/[0-9a-f]{8}|bot[0-9]{6,}:[A-Za-z0-9_-]{30,}' \
               --exclude-dir=.git . ; then
            echo "FALLO: hay algo que parece una credencial en el repo"; exit 1
          fi
          echo "ok: sin credenciales en el repo"

  # La ruta de Windows no tenía prueba, y por eso llevaba rota sin que nadie lo
  # notara: el README mandaba ejecutar el script POSIX con `sh.exe`, que no está
  # en el PATH de una máquina Windows normal (Git para Windows solo añade `cmd\`).
  # Este job corre el equivalente en PowerShell — pwsh y python3 vienen en el
  # runner — con los mismos casos que el de arriba: lo que no se prueba, calla.
  avisos-ps1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis y ninguna función llamada que no exista
        shell: pwsh
        run: |
          $tokens = $null; $errores = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path ./scripts/configurar-avisos.ps1).Path, [ref]$tokens, [ref]$errores)
          if ($errores) {
              $errores | ForEach-Object { Write-Output "FALLO (sintaxis): línea $($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
          }
          $definidas = $ast.FindAll({ param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true).Name
          # Solo nombres con forma Verbo-Nombre: los comandos nativos (icacls,
          # chmod, podman) no se resuelven en Linux y darían falsos positivos.
          $faltan = $ast.FindAll({ param($n)
                  $n -is [System.Management.Automation.Language.CommandAst] }, $true) |
              ForEach-Object { $_.GetCommandName() } | Where-Object { $_ } |
              Sort-Object -Unique | Where-Object {
                  $_ -match '^[A-Z][a-zA-Z]*-[A-Za-z]+$' -and
                  $definidas -notcontains $_ -and
                  -not (Get-Command $_ -ErrorAction SilentlyContinue)
              }
          if ($faltan) {
              Write-Output "FALLO: llama a funciones que no existen:"
              $faltan | ForEach-Object { Write-Output "  - $_" }
              exit 1
          }
          # El script tiene que correr también en Windows PowerShell 5.1: el
          # README solo pide PowerShell 7 para el `&&` que encadena comandos.
          if (Select-String -Path ./scripts/configurar-avisos.ps1 -Pattern '\?\s*\$\w+\s*:\s*' -Quiet) {
              Write-Output "FALLO: operador ternario (PowerShell 7+); 5.1 no lo parsea"
              exit 1
          }
          Write-Output "ok: parsea, no llama a nada inexistente y no usa sintaxis de PS7"

      - name: Prepara un entorno de prueba (hooks y servidor de ping simulados)
        run: |
          set -eu
          d="$RUNNER_TEMP/avps"; mkdir -p "$d/hooks" "$d/despliegue"
          printf '#!/bin/sh\nexit 0\n' > "$d/hooks/10-healthchecks.sh.ejemplo"
          # Mismo compose que emite `deploy.ps1 -Prefix sherman … -Vigilar`. El
          # directorio se llama "despliegue" A PROPÓSITO: si el nombre del check
          # volviera a salir de la carpeta, aquí saldría "despliegue".
          cat > "$d/despliegue/compose.yaml" <<'YML'
          services:
            vigia:
              environment:
                VIGIA_CLUSTER: "sherman"
                VIGIA_HOST: "mmJA"
          YML
          printf 'services:\n  vigia:\n    environment:\n      VIGIA_CLUSTER: "sherman"\n' > "$d/viejo.yaml"
          # Servidor de ping simulado: apunta las URLs que le pidan y responde 500
          # si la URL lleva la marca FALLA. HC_BASE es la misma variable que lee el
          # hook para una instancia self-hosted, así que no hay camino de prueba
          # que el código real no use.
          cat > "$d/stub.py" <<'PY'
          import http.server, sys
          LOG = sys.argv[2]
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  open(LOG, 'a').write(self.path + "\n")
                  self.send_response(500 if 'FALLA' in self.path else 200)
                  self.send_header('Content-Length', '2'); self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', int(sys.argv[1])), H).serve_forever()
          PY
          nohup python3 "$d/stub.py" 8099 "$d/urls" >/dev/null 2>&1 &
          for _ in 1 2 3 4 5; do sleep 1; done
          {
            echo "AVPS=$d"
            echo "HC_BASE=http://127.0.0.1:8099"
          } >> "$GITHUB_ENV"

      - name: Rechaza configuraciones que no pueden funcionar
        run: |
          set -eu
          S="pwsh -NoProfile -File scripts/configurar-avisos.ps1 -Hooks $AVPS/hooks -Conf $AVPS/avisos.conf -NoPreguntar"
          rechaza() {  # $1 = descripción, resto = parámetros
            _desc="$1"; shift
            _rc=0; _out="$($S "$@" 2>&1 </dev/null)" || _rc=$?
            [ "$_rc" -ne 0 ] || { echo "FALLO: aceptó una configuración inválida ($_desc)"; exit 1; }
            # No basta con "salió distinto de cero": un script que no parsea también
            # lo hace. Tiene que ser un rechazo EXPLÍCITO.
            printf '%s\n' "$_out" | grep -q '^ERROR:' \
              || { echo "FALLO: no rechazó ($_desc), falló por otra cosa: $_out"; exit 1; }
            echo "ok: rechaza $_desc"
          }
          rechaza 'una URL que no es https' -HcUrl 'http://hc-ping.com/uuid'
          rechaza 'ningún canal'
          rechaza 'una ping key sin compose.yaml' -Compose "$AVPS/no-existe.yaml" -HcPingKey 'PKTEST'
          rechaza 'un compose sin VIGIA_HOST'     -Compose "$AVPS/viejo.yaml"     -HcPingKey 'PKTEST'

      - name: Configura, activa el hook y prueba el canal
        run: |
          set -eu
          rm -f "$AVPS/avisos.conf" "$AVPS/urls" "$AVPS/hooks/10-healthchecks.sh"
          pwsh -NoProfile -File scripts/configurar-avisos.ps1 -Hooks "$AVPS/hooks" \
            -Conf "$AVPS/avisos.conf" -Compose "$AVPS/despliegue/compose.yaml" \
            -NoPreguntar -HcPingKey 'PKTEST' </dev/null

          # El fichero lo lee `.` de /bin/sh DENTRO del contenedor: con CRLF o con
          # BOM, el valor llevaría un \r pegado o la primera línea no sería un
          # comentario, y el ping iría a una URL que no existe.
          grep -q $'\r' "$AVPS/avisos.conf" && { echo "FALLO: avisos.conf con CRLF"; exit 1; }
          head -c 3 "$AVPS/avisos.conf" | grep -q $'\xef\xbb\xbf' && { echo "FALLO: avisos.conf con BOM"; exit 1; }
          grep -q "^HC_PING_KEY='PKTEST'$" "$AVPS/avisos.conf" || { echo "FALLO: HC_PING_KEY"; exit 1; }
          [ -x "$AVPS/hooks/10-healthchecks.sh" ] || { echo "FALLO: no activó el hook"; exit 1; }

          # La misma identidad que el .sh: el check es del cluster EN esta máquina,
          # y sale del compose, no del nombre del directorio. Los dos scripts y el
          # hook de gh_runner son los tres extremos del mismo contrato.
          url="$(head -n1 "$AVPS/urls")"
          [ "$url" = '/PKTEST/sherman-mmja?create=1' ] \
            || { echo "FALLO: pingeó '$url', se esperaba '/PKTEST/sherman-mmja?create=1'"; exit 1; }
          echo "ok: escribe la configuración, activa el hook y pingea el check del vigía"

      - name: Un canal que no responde sale en ROJO y no pisa lo que funcionaba
        run: |
          set -eu
          if pwsh -NoProfile -File scripts/configurar-avisos.ps1 -Hooks "$AVPS/hooks" \
               -Conf "$AVPS/avisos.conf" -Compose "$AVPS/despliegue/compose.yaml" \
               -NoPreguntar -HcPingKey 'PKFALLA' >/dev/null 2>&1 </dev/null; then
            echo "FALLO: un canal roto pasó como bueno"; exit 1
          fi
          grep -q 'PKFALLA' "$AVPS/avisos.conf" && { echo "FALLO: guardó una configuración que acababa de declarar rota"; exit 1; }
          grep -q "^HC_PING_KEY='PKTEST'$" "$AVPS/avisos.conf" \
            || { echo "FALLO: pisó la configuración que sí funcionaba"; exit 1; }
          echo "ok: un intento fallido deja intacto lo que ya funcionaba"

      - name: Re-ejecutarlo no vuelve a pedir nada, ni pisa un hook ajustado
        run: |
          set -eu
          echo '# ajuste propio' >> "$AVPS/hooks/10-healthchecks.sh"
          chmod -x "$AVPS/hooks/10-healthchecks.sh"
          salida="$(pwsh -NoProfile -File scripts/configurar-avisos.ps1 -Hooks "$AVPS/hooks" \
                      -Conf "$AVPS/avisos.conf" -Compose "$AVPS/despliegue/compose.yaml" \
                      -NoPreguntar 2>&1 </dev/null)"
          printf '%s\n' "$salida" | grep -q 'Reusando' || {
            echo "FALLO: no reusó la configuración previa"; printf '%s\n' "$salida"; exit 1; }
          grep -q '# ajuste propio' "$AVPS/hooks/10-healthchecks.sh" \
            || { echo "FALLO: pisó un hook ya ajustado"; exit 1; }
          # `vigilar.sh` solo ejecuta lo que pasa `[ -x ]`: un hook sin ese bit es
          # idéntico a no tenerlo, y en silencio.
          [ -x "$AVPS/hooks/10-healthchecks.sh" ] \
            || { echo "FALLO: el hook sigue sin permiso de ejecución"; exit 1; }
          echo "ok: re-ejecutable, idempotente y repone el permiso de ejecución"

      # Los dos scripts escriben el MISMO fichero, que leen los mismos hooks. Si
      # uno cambiara de formato, la máquina configurada desde la otra shell se
      # quedaría sin avisos sin que nada fallara.
      - name: El .sh y el .ps1 escriben el mismo formato
        run: |
          set -eu
          mkdir -p "$AVPS/bin"
          printf '#!/bin/sh\nexit 0\n' > "$AVPS/bin/curl"; chmod +x "$AVPS/bin/curl"
          rm -f "$AVPS/conf-sh" "$AVPS/conf-ps"
          PATH="$AVPS/bin:$PATH" sh scripts/configurar-avisos.sh --hooks "$AVPS/hooks" \
            --conf "$AVPS/conf-sh" --no-preguntar --hc-url 'https://hc-ping.com/uuid' >/dev/null 2>&1
          pwsh -NoProfile -File scripts/configurar-avisos.ps1 -Hooks "$AVPS/hooks" \
            -Conf "$AVPS/conf-ps" -NoPreguntar -NoProbar -HcUrl 'https://hc-ping.com/uuid' >/dev/null 2>&1 </dev/null
          # Se comparan los valores, no las cabeceras (cada script firma la suya).
          diff -u <(grep -v '^#' "$AVPS/conf-sh") <(grep -v '^#' "$AVPS/conf-ps") \
            || { echo "FALLO: los dos scripts escriben avisos.conf distinto"; exit 1; }
          echo "ok: mismo formato de avisos.conf desde las dos shells"

  # `scripts/aprovisionar-macos.sh` es el gancho `--provisionar` de `hornear-macos.sh`
  # (gh_runner): lo ejecuta DENTRO de la VM golden, por ssh, y la golden se congela justo
  # después. Un fallo a mitad de camino sin más prueba que "se ve razonable" se descubre
  # en el primer job real, con el runner ya en producción — la misma familia de fallo
  # silencioso que motivó el resto de este workflow. Aquí no hay una VM de macOS de
  # verdad (el fleet corre en Linux), así que se prueba la LÓGICA del script con
  # herramientas simuladas (`brew`, `corepack`, `rustup-init`/`rustup`, `curl`,
  # `xcodebuild`): que instala en la primera pasada, que la segunda no reinstala nada
  # (idempotencia, obligatoria porque `--completo` se reintenta tras un fallo) y que
  # aborta con un mensaje útil si una herramienta no queda instalada.
  aprovisionar-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara un macOS simulado (brew, corepack, rustup, curl, xcodebuild)
        run: |
          set -eu
          d="$RUNNER_TEMP/apm"; mkdir -p "$d/bin" "$d/home" "$d/log"
          {
            echo "APM=$d"
            echo "APM_HOME=$d/home"
          } >> "$GITHUB_ENV"

          # `brew`: instala node@22 (crea el stub de `node` + `corepack`) y
          # `rustup-init` (crea el stub de `rustup`/`cargo` en ~/.cargo/bin, como
          # hace el rustup-init real). Registra cada llamada en brew.log para que
          # la prueba de idempotencia pueda comprobar que la segunda vuelta no
          # vuelve a instalar.
          cat > "$d/bin/brew" <<'BREW'
          #!/bin/sh
          echo "brew $*" >> "$APM/log/brew.log"
          case "$1" in
            shellenv) echo "export PATH=\"$APM/bin:\$PATH\"" ;;
            install)
              shift
              for pkg in "$@"; do
                case "$pkg" in
                  node@22)
                    printf '#!/bin/sh\n[ "$1" = "--version" ] && echo "v22.11.0"\n' > "$APM/bin/node"
                    chmod +x "$APM/bin/node"
                    cat > "$APM/bin/corepack" <<'COREPACK'
          #!/bin/sh
          echo "corepack $*" >> "$APM/log/corepack.log"
          case "$1" in
            enable) exit 0 ;;
            prepare)
              ver="${2#pnpm@}"
              printf '#!/bin/sh\n[ "$1" = "--version" ] && echo "%s"\n' "$ver" > "$APM/bin/pnpm"
              chmod +x "$APM/bin/pnpm"
              ;;
          esac
          COREPACK
                    chmod +x "$APM/bin/corepack"
                    ;;
                  rustup-init)
                    cat > "$APM/bin/rustup-init" <<'RUSTUPINIT'
          #!/bin/sh
          echo "rustup-init $*" >> "$APM/log/rustup-init.log"
          mkdir -p "$HOME/.cargo/bin"
          printf '#!/bin/sh\necho "rustup $*" >> "$APM/log/rustup.log"\nexit 0\n' > "$HOME/.cargo/bin/rustup"
          printf '#!/bin/sh\n[ "$1" = "--version" ] && echo "cargo 1.82.0"\n' > "$HOME/.cargo/bin/cargo"
          chmod +x "$HOME/.cargo/bin/rustup" "$HOME/.cargo/bin/cargo"
          RUSTUPINIT
                    chmod +x "$APM/bin/rustup-init"
                    ;;
                esac
              done
              ;;
            link) : ;;
          esac
          BREW
          chmod +x "$d/bin/brew"

          printf '#!/bin/sh\n[ "$1" = "-version" ] && printf "Xcode 16.4\\nBuild version 16F6\\n"\n' > "$d/bin/xcodebuild"
          chmod +x "$d/bin/xcodebuild"

          # `curl` NO debería invocarse nunca en este entorno: brew y rustup-init
          # ya están "instalados" (son los stubs de arriba), así que el único
          # camino que llamaría a curl es el de bootstrap de Homebrew, que aquí
          # sería un defecto del script (asumir curl sin comprobarlo). Falla
          # fuerte para que la prueba lo note en vez de colgarse.
          printf '#!/bin/sh\necho "curl no debería haberse llamado: $*" >&2\nexit 1\n' > "$d/bin/curl"
          chmod +x "$d/bin/curl"

      - name: 'Primera pasada: instala todo y verifica en verde'
        run: |
          set -eu
          export HOME="$APM_HOME" MACOS_STUB_LOG="$APM/log" MACOS_STUB_BIN="$APM/bin"
          export PATH="$APM/bin:$APM_HOME/.cargo/bin:/usr/bin:/bin"
          salida="$(sh scripts/aprovisionar-macos.sh 2>&1)" || {
            echo "FALLO: la primera pasada no terminó en verde"; printf '%s\n' "$salida"; exit 1; }
          printf '%s\n' "$salida" | grep -q 'Aprovisionamiento de macOS para sherman-svelte completado.' \
            || { echo "FALLO: no llegó al mensaje final de éxito"; printf '%s\n' "$salida"; exit 1; }
          grep -qx 'brew install node@22' "$APM/log/brew.log" || { echo "FALLO: no instaló Node"; exit 1; }
          grep -qx 'brew install rustup-init' "$APM/log/brew.log" || { echo "FALLO: no instaló rustup"; exit 1; }
          echo "ok: primera pasada instala Node, pnpm y Rust, y verifica en verde"

      - name: 'Segunda pasada seguida: no reinstala nada (idempotencia)'
        run: |
          set -eu
          export HOME="$APM_HOME" MACOS_STUB_LOG="$APM/log" MACOS_STUB_BIN="$APM/bin"
          export PATH="$APM/bin:$APM_HOME/.cargo/bin:/usr/bin:/bin"
          rm -f "$APM/log/brew.log" "$APM/log/corepack.log"
          salida="$(sh scripts/aprovisionar-macos.sh 2>&1)" || {
            echo "FALLO: la segunda pasada no terminó en verde"; printf '%s\n' "$salida"; exit 1; }
          printf '%s\n' "$salida" | grep -q 'Aprovisionamiento de macOS para sherman-svelte completado.' \
            || { echo "FALLO: la segunda pasada no llegó al mensaje final de éxito"; printf '%s\n' "$salida"; exit 1; }
          # Sin ninguna línea de "instalando": los tres pasos detectaron la
          # versión ya satisfecha y no llamaron a brew/corepack de nuevo.
          [ -s "$APM/log/brew.log" ] && { echo "FALLO: la segunda pasada volvió a llamar a brew install/link"; cat "$APM/log/brew.log"; exit 1; }
          [ -s "$APM/log/corepack.log" ] && { echo "FALLO: la segunda pasada volvió a llamar a corepack"; cat "$APM/log/corepack.log"; exit 1; }
          echo "ok: la segunda pasada es idempotente, no reinstala Node/pnpm/rustup"

      - name: Sin xcodebuild, aborta alto y claro (no sigue en silencio)
        run: |
          set -eu
          rm -f "$APM/bin/xcodebuild"
          export HOME="$APM_HOME" MACOS_STUB_LOG="$APM/log" MACOS_STUB_BIN="$APM/bin"
          export PATH="$APM/bin:$APM_HOME/.cargo/bin:/usr/bin:/bin"
          rc=0; salida="$(sh scripts/aprovisionar-macos.sh 2>&1)" || rc=$?
          [ "$rc" -ne 0 ] || { echo "FALLO: siguió en silencio sin xcodebuild"; exit 1; }
          printf '%s\n' "$salida" | grep -q 'xcodebuild: no está instalado' \
            || { echo "FALLO: no dio un motivo claro del fallo"; printf '%s\n' "$salida"; exit 1; }
          echo "ok: aborta con un mensaje útil si una herramienta no quedó instalada"
