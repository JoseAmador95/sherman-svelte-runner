name: vigilar-runners

# Revisa cada hora que los runners del fleet sigan en línea y avisa por Telegram cuando cambia el
# estado.
#
# ES EL ÚNICO AVISO DE FLEET CAÍDO, y por eso importa. La CI de `demeneghi/sherman-svelte` apunta
# al fleet con `runs-on` FIJO, sin respaldo en runners de pago: si el fleet no responde, sus jobs
# se quedan EN COLA (GitHub los descarta a las 24 h) en vez de irse a `ubuntu-latest`. No hay
# factura ni corrida roja que delate el problema — solo este cron.
#
# Además, al ir por reloj y no por corrida, cubre las noches y fines de semana en los que nadie
# empuja código y la CI no corre, que es cuando el fleet se cae sin que nadie mire.
#
# POR QUÉ VIVE EN ESTE REPO: es público, y en repos públicos los minutos de los runners estándar
# de GitHub son gratis. El mismo cron en el repo de la app (privado) se facturaría cada hora.
#
# SECRETS (Settings → Secrets and variables → Actions):
#   SHERMAN_PAT         Fine-grained de demeneghi, alcance SOLO `demeneghi/sherman-svelte`,
#                       permiso **Administration: Read-only**. Con solo lectura puede listar los
#                       runners pero NO registrarlos ni borrarlos: si el token se filtrase, lo peor
#                       que permite es ver los nombres del fleet. Ponle caducidad y rótalo.
#   TELEGRAM_BOT_TOKEN  Bot que manda el aviso.
#   TELEGRAM_CHAT_ID    Chat destino.
#   TELEGRAM_THREAD_ID  Opcional: solo para grupos con temas.
#
# VARIABLES (opcionales, con valor por defecto abajo):
#   REPO_VIGILADO · CI_RUNNER_LABEL · RUNNERS_ESPERADOS · RUNNERS_ESPERADOS_POR
#
#   RUNNERS_ESPERADOS_POR  Reparto por plataforma: «linux=13,macos=2!,escritorio=1». El sufijo `!`
#                       marca el grupo como efímero (las VMs de Tart se destruyen y se recrean entre
#                       jobs, y durante 60-90 s no hay runner registrado), y su déficit se confirma
#                       en DOS rondas antes de avisar. La caída real de un Mac la ve antes el vigía
#                       del host (`vigilar.sh`, ronda de 5 min), que mira el slot y no el registro.
#
#                       OJO CON `linux=13`, y no 12: el runner de escritorio corre en un contenedor,
#                       así que GitHub le pone `Linux` además de `escritorio` y cuenta en LOS DOS
#                       grupos. Con `linux=12` sobraba uno, y entonces perder un runner Linux del
#                       registro dejaba el grupo en 12 -es decir, en su cuenta esperada- y el aviso
#                       NO sonaba: el de escritorio tapaba el hueco. El caso está fijado en
#                       `scripts/vigilar-runners.test.mjs`.
#                       OJO al ajustarlo: el runner de escritorio es un contenedor, así que GitHub
#                       le pone también la etiqueta `Linux` y cuenta en los dos grupos.

on:
  schedule:
    # Cada hora en punto. Cambiar la cadencia es cambiar solo esta línea.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Mandar el aviso aunque el estado no haya cambiado (sirve para probar que los secretos funcionan)'
        type: boolean
        default: false

concurrency:
  # Una ronda a la vez: dos en paralelo se pisarían la caché de estado y duplicarían el aviso.
  group: vigilar-runners
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO_VIGILADO: ${{ vars.REPO_VIGILADO || 'demeneghi/sherman-svelte' }}
      CI_RUNNER_LABEL: ${{ vars.CI_RUNNER_LABEL || 'sherman' }}
      RUNNERS_ESPERADOS: ${{ vars.RUNNERS_ESPERADOS || '12' }}
      RUNNERS_ESPERADOS_POR: ${{ vars.RUNNERS_ESPERADOS_POR || 'linux=13,macos=2!,escritorio=1' }}
    steps:
      - uses: actions/checkout@v4

      # Estado de la ronda anterior, para avisar solo cuando algo CAMBIA. Se usa `actions/cache` y
      # no una variable de repo porque así no hace falta ningún permiso de escritura; con el cron
      # horario la entrada nunca llega a los 7 días de purga. La clave lleva `run_id` para que
      # nunca acierte (el post-save guarda siempre lo fresco) y `restore-keys` recupera la última.
      - name: Restaurar estado de la ronda anterior
        uses: actions/cache@v4
        with:
          path: .estado-fleet.json
          key: vigilar-runners-${{ github.run_id }}
          restore-keys: |
            vigilar-runners-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sin dependencias: el script solo usa `fetch` de Node 22.
      - name: Revisar el fleet y avisar si cambió
        env:
          SHERMAN_PAT: ${{ secrets.SHERMAN_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        # `inputs.forzar` solo existe en `workflow_dispatch`; en el cron es nulo, o sea falso, y la
        # expresión se queda en cadena vacía. La rama VERDADERA devuelve texto no vacío a propósito:
        # en las expresiones de Actions la cadena vacía es *falsy*, así que un `cond && '' || 'x'`
        # colapsaría siempre a 'x'. Aquí el orden es el bueno y no hay trampa.
        run: |
          node scripts/vigilar-runners.mjs \
            --repo="$REPO_VIGILADO" \
            --etiqueta="$CI_RUNNER_LABEL" \
            --esperados="$RUNNERS_ESPERADOS" \
            --esperados-por="$RUNNERS_ESPERADOS_POR" \
            --estado=.estado-fleet.json \
            ${{ inputs.forzar && '--forzar' || '' }}
